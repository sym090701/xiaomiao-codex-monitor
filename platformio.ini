[platformio]
default_envs = xiaomiao

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
; The physical controller is an ESP32-C3 SuperMini. The XIAO profile is used
; only as a compatible ESP32-C3 PlatformIO build/upload environment.
board = seeed_xiao_esp32c3
framework = arduino
build_src_filter = +<main.cpp> -<main_no_light_sensor.cpp>
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.1
  bblanchon/ArduinoJson@^6.21.5
  links2004/WebSockets@^2.6.1

[env:seeed_xiao_esp32c3_no_light_sensor]
extends = env:seeed_xiao_esp32c3
build_src_filter = -<main.cpp> +<main_no_light_sensor.cpp>

[env:xiaomiao]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter = -<main.cpp> +<main_no_light_sensor.cpp>
build_flags = -DXIAOMIAO
extra_scripts = pre:scripts/embed_page.py
lib_deps = ${env:seeed_xiao_esp32c3.lib_deps}
monitor_speed = 115200

[env:xiaomiao_preconfigured]
extends = env:xiaomiao
build_flags = ${env:xiaomiao.build_flags} -DXM_PRECONFIGURED
extra_scripts =
  pre:scripts/embed_page.py
  pre:scripts/embed_device.py

[env:xiaomiao_standalone]
extends = env:xiaomiao
board_build.partitions = partitions-xiaomiao-ota.csv
build_flags = ${env:xiaomiao.build_flags} -DXM_STANDALONE_OTA
extra_scripts =
  pre:scripts/embed_page.py
  pre:scripts/embed_ota.py

[env:xiaomiao_standalone_preconfigured]
extends = env:xiaomiao_standalone
build_flags = ${env:xiaomiao_standalone.build_flags} -DXM_PRECONFIGURED
extra_scripts =
  pre:scripts/embed_page.py
  pre:scripts/embed_device.py
  pre:scripts/embed_ota.py
