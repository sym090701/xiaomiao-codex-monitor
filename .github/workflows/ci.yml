name: XiaoMiao build and tests

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt platformio
      - run: python -m unittest discover -s test -v
      - run: pio run
      - name: Build preconfigured variant using public example values only
        run: |
          cp device.example.json device.local.json
          pio run -e xiaomiao_preconfigured
