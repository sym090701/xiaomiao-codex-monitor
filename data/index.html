<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Usage Display</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0d12; color: #edf2ff; }
    main { max-width: 560px; margin: 0 auto; padding: 22px; }
    h1 { margin: 0 0 18px; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 17px; }
    .panel { margin: 12px 0; padding: 16px; border: 1px solid #283041; border-radius: 8px; background: #151925; }
    .status { color: #8d98ad; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
    .ok { color: #66e1bd; }
    label { display: block; margin: 12px 0 6px; color: #aab4c8; font-size: 13px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #3a4358; border-radius: 6px; background: #0d111b; color: #fff; font-size: 16px; }
    button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 6px; background: #37d1b0; color: #06110f; font-size: 16px; font-weight: 700; }
    button:disabled { opacity: .55; }
    .row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
    .color-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 14px; }
    input[type="color"] { height: 46px; padding: 5px; cursor: pointer; }
    input[type="range"] { padding: 0; accent-color: #37d1b0; }
    .range-value { float: right; color: #edf2ff; }
    .preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .preset { margin: 0; padding: 9px; border: 1px solid #3a4358; background: #202638; color: #edf2ff; font-size: 14px; }
    #notice { display: none; }
    #notice.show { display: block; }
    @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Codex Usage Display</h1>
    <div id="notice" class="panel ok" role="status"></div>

    <section class="panel status">
      设备热点：<span id="apName">--</span><br>
      配置页：<span id="apUrl" class="ok">--</span><br>
      <span id="lanRow" hidden>局域网地址：<span id="lanUrl" class="ok"></span><br></span>
      当前数据源：<span id="usageUrl">--</span>
    </section>

    <form id="configForm">
      <section class="panel">
        <h2>网络</h2>
        <label for="ssid">Wi-Fi 名称</label>
        <input id="ssid" name="ssid" autocomplete="off">
        <label for="pass">Wi-Fi 密码</label>
        <input id="pass" name="pass" type="password">
      </section>

      <section class="panel">
        <h2>main.py 服务</h2>
        <div class="row">
          <div>
            <label for="host">IP 地址或主机名</label>
            <input id="host" name="host" required>
          </div>
          <div>
            <label for="port">端口</label>
            <input id="port" name="port" type="number" min="1" max="65535" required>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>显示</h2>
        <label for="displayMode">显示模式</label>
        <select id="displayMode" name="display_mode">
          <option value="0">Codex 用量</option>
          <option value="1">性能监视</option>
        </select>
        <div class="row">
          <div>
            <label for="refreshSeconds">数据更新间隔（秒）</label>
            <input id="refreshSeconds" name="refresh_seconds" type="number" min="1" max="3600" required>
          </div>
          <div>
            <label for="screenDirection">屏幕方向</label>
            <select id="screenDirection" name="screen_direction">
              <option value="normal">正常</option>
              <option value="flipped">上下翻转</option>
            </select>
          </div>
        </div>
        <label for="memoryMetric">性能页内存指标</label>
        <select id="memoryMetric" name="memory_metric">
          <option value="0">内存使用率</option>
          <option value="1">内存压力</option>
        </select>
        <div id="backlightControl" hidden>
          <label for="backlightBrightness">
            ESP 背光亮度
            <span id="backlightBrightnessValue" class="range-value">100%</span>
          </label>
          <input id="backlightBrightness" name="backlight_brightness"
                 type="range" min="1" max="100" step="1" value="100">
        </div>
      </section>

      <section class="panel">
        <h2>Codex 状态条</h2>
        <label for="codexWorkingAnimation">工作动画</label>
        <select id="codexWorkingAnimation" name="codex_working_animation">
          <option value="1">单色流光</option>
          <option value="2">彩色光带</option>
        </select>
        <div class="color-grid">
          <div>
            <label for="codexPermissionColor">等待授权 · 呼吸</label>
            <input id="codexPermissionColor" name="codex_permission_color" type="color">
          </div>
          <div>
            <label for="codexWorkingColor">工作颜色 · 单色流光</label>
            <input id="codexWorkingColor" name="codex_working_color" type="color">
          </div>
          <div>
            <label for="codexStopColor">任务停止 · 常亮</label>
            <input id="codexStopColor" name="codex_stop_color" type="color">
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>性能监视器配色</h2>
        <label>配色预设</label>
        <div class="preset-grid">
          <button class="preset" type="button" data-preset="ocean">深海</button>
          <button class="preset" type="button" data-preset="cyber">霓虹</button>
          <button class="preset" type="button" data-preset="sunset">日落</button>
          <button class="preset" type="button" data-preset="mono">黑白</button>
        </div>
        <div class="color-grid">
          <div>
            <label for="performanceBackground">背景</label>
            <input id="performanceBackground" name="performance_background" type="color">
          </div>
          <div>
            <label for="performanceCpuColor">CPU</label>
            <input id="performanceCpuColor" name="performance_cpu_color" type="color">
          </div>
          <div>
            <label for="performanceMemoryColor">内存</label>
            <input id="performanceMemoryColor" name="performance_memory_color" type="color">
          </div>
          <div>
            <label for="performanceDiskColor">磁盘</label>
            <input id="performanceDiskColor" name="performance_disk_color" type="color">
          </div>
          <div>
            <label for="performanceLoadColor">负载</label>
            <input id="performanceLoadColor" name="performance_load_color" type="color">
          </div>
          <div>
            <label for="performanceRxColor">下载 RX</label>
            <input id="performanceRxColor" name="performance_rx_color" type="color">
          </div>
          <div>
            <label for="performanceTxColor">上传 TX</label>
            <input id="performanceTxColor" name="performance_tx_color" type="color">
          </div>
        </div>
      </section>
      <button id="saveButton" type="submit">保存并应用</button>
    </form>
  </main>

  <script>
    const byId = id => document.getElementById(id);
    const form = byId("configForm");
    const notice = byId("notice");
    const colorFields = {
      performance_background: "performanceBackground",
      performance_cpu_color: "performanceCpuColor",
      performance_memory_color: "performanceMemoryColor",
      performance_disk_color: "performanceDiskColor",
      performance_load_color: "performanceLoadColor",
      performance_rx_color: "performanceRxColor",
      performance_tx_color: "performanceTxColor"
    };
    const codexColorFields = {
      codex_permission_color: ["codexPermissionColor", "#ffb020"],
      codex_working_color: ["codexWorkingColor", "#4f8cff"],
      codex_stop_color: ["codexStopColor", "#4ce0b3"]
    };
    const presets = {
      ocean: ["#080a10", "#37d1b0", "#77dc57", "#ffc440", "#66e1bd", "#37d1b0", "#77dc57"],
      cyber: ["#12081c", "#00f5d4", "#f15bb5", "#fee440", "#9b5de5", "#00bbf9", "#f15bb5"],
      sunset: ["#160b0b", "#ff6b6b", "#ffd166", "#f8961e", "#f3722c", "#43aa8b", "#4d96ff"],
      mono: ["#080808", "#ffffff", "#d9d9d9", "#b8b8b8", "#e8e8e8", "#cfcfcf", "#afafaf"]
    };

    document.querySelectorAll("[data-preset]").forEach(button => {
      button.addEventListener("click", () => {
        const values = presets[button.dataset.preset];
        Object.values(colorFields).forEach((id, index) => byId(id).value = values[index]);
      });
    });

    async function loadConfig() {
      const response = await fetch("/api/config", { cache: "no-store" });
      if (!response.ok) throw new Error("无法读取设备配置");
      const config = await response.json();
      for (const key of ["ssid", "pass", "host", "port"]) byId(key).value = config[key] ?? "";
      byId("refreshSeconds").value = config.refresh_seconds ?? 30;
      byId("screenDirection").value = config.screen_flipped ? "flipped" : "normal";
      byId("displayMode").value = String(config.display_mode ?? 0);
      byId("memoryMetric").value = String(config.memory_metric ?? 0);
      const canAdjustBacklight = config.has_light_sensor === false;
      byId("backlightControl").hidden = !canAdjustBacklight;
      byId("backlightBrightness").disabled = !canAdjustBacklight;
      byId("backlightBrightness").value = config.backlight_brightness ?? 100;
      byId("backlightBrightnessValue").textContent = `${byId("backlightBrightness").value}%`;
      byId("codexWorkingAnimation").value = String(Number(config.codex_working_animation) === 2 ? 2 : 1);
      for (const [key, id] of Object.entries(colorFields)) {
        byId(id).value = config[key] ?? presets.ocean[Object.keys(colorFields).indexOf(key)];
      }
      for (const [key, [id, fallback]] of Object.entries(codexColorFields)) {
        byId(id).value = config[key] ?? fallback;
      }
      byId("apName").textContent = config.ap_name;
      byId("apUrl").textContent = `http://${config.ap_ip}`;
      byId("usageUrl").textContent = config.display_mode === 1 ? config.performance_url : config.usage_url;
      byId("lanRow").hidden = !config.connected;
      byId("lanUrl").textContent = config.connected ? `http://${config.local_ip}` : "";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const button = byId("saveButton");
      button.disabled = true;
      notice.classList.remove("show");
      try {
        const response = await fetch("/save", { method: "POST", body: new URLSearchParams(new FormData(form)) });
        if (!response.ok) throw new Error("保存失败");
        notice.textContent = "已保存，设备正在重新连接 Wi-Fi。";
        notice.classList.add("show");
        await loadConfig();
      } catch (error) {
        notice.textContent = error.message;
        notice.classList.add("show");
      } finally {
        button.disabled = false;
      }
    });

    byId("backlightBrightness").addEventListener("input", event => {
      byId("backlightBrightnessValue").textContent = `${event.target.value}%`;
    });

    loadConfig().catch(error => {
      notice.textContent = error.message;
      notice.classList.add("show");
    });
  </script>
</body>
</html>
